services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ipoe

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ipoe

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/deepeyexeven}/netcore-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Manila}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - libreqos:/opt/libreqos/src
    expose:
      - '3001'
    networks:
      - ipoe

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/deepeyexeven}/netcore-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Manila}
    depends_on:
      - api
    expose:
      - '3000'
    networks:
      - ipoe

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - web
      - api
    networks:
      - ipoe

  updater:
    image: ${IMAGE_REGISTRY:-ghcr.io/deepeyexeven}/netcore-updater:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # REPO_DIR must match the HOST path of the deployment dir so that the
      # `docker compose up` issued from inside this container resolves relative
      # bind-mount paths (e.g. ./docker/nginx/nginx.conf) against the host.
      REPO_DIR: ${REPO_DIR:-/opt/netcore}
      IMAGE_REGISTRY: ${IMAGE_REGISTRY:-ghcr.io/deepeyexeven}
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    working_dir: ${REPO_DIR:-/opt/netcore}
    volumes:
      # Bind-mount the deployment dir at the SAME host path so `docker compose`
      # run through the mounted docker.sock resolves file paths on the host.
      # On a customer host this dir holds only compose files + .env + nginx.conf
      # (no application source).
      - ${REPO_DIR:-/opt/netcore}:${REPO_DIR:-/opt/netcore}
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - '9099'
    networks:
      - ipoe

volumes:
  pgdata:
  redisdata:
  libreqos:

networks:
  ipoe:
    driver: bridge
